# Save this file in your NicoleMumo/NicoleMumo profile repo as:
#   .github/workflows/snake.yml
#
# It creates the snake image and saves it on a branch called "output",
# which is the path your README already points to.
#
# Colors: the original GitHub dark colors (green dots, purple snake).
# To go back to custom colors, replace "palette=github-dark" with
#   color_snake=#00E5FF&color_dots=#2A2F3A,#FF0080,#FF0080,#FF0080,#FF0080

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it by hand
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
